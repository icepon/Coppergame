<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Paw Patrol Pontificator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #2b3a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 480px;
      height: 640px;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      border: 4px solid #1a232c;
      border-radius: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* On-screen controls */
    .touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      background: #fff;
      border: 4px solid #000;
      border-radius: 6px;
      width: 64px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
      font-size: 24px;
      font-weight: bold;
      color: #000;
    }
    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }
    /* Game Over Modal */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #game-over-screen h1 {
      color: #ff3333;
      font-size: 24px;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #000;
    }
    #game-over-screen p {
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    #restart-btn {
      margin-top: 20px;
      font-family: inherit;
      background: #ffcc00;
      border: 3px solid #000;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
    }
    #restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    
    <div class="touch-controls">
      <div style="display: flex; gap: 8px;">
        <button class="ctrl-btn" id="btn-left">◀</button>
      </div>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>

    <div id="game-over-screen">
      <h1>STEPPED ON POOP!</h1>
      <p id="final-score">SCORE: 0</p>
      <p id="final-level">LEVEL: 1</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");
    const finalLevelEl = document.getElementById("final-level");
    const restartBtn = document.getElementById("restart-btn");

    // Perspective Projection Parameters
    const HORIZON_Y = 240; 
    const ROAD_TOP_W = 140;
    const ROAD_BOTTOM_W = 440;
    const ROAD_CENTER_X = 230;

    let score = 0;
    let level = 1;
    let speed = 0.006;
    let isGameOver = false;

    // Player State
    const player = {
      laneX: 0,       // -1.0 (left) to +1.0 (right)
      targetX: 0,
      z: 0.92,        // fixed near camera
      size: 70
    };

    // Obstacles
    let obstacles = [];
    let spawnTimer = 0;

    // Input handlers
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    // Touch / On-screen Buttons
    document.getElementById("btn-left").addEventListener("pointerdown", () => keys["ArrowLeft"] = true);
    document.getElementById("btn-left").addEventListener("pointerup", () => keys["ArrowLeft"] = false);
    document.getElementById("btn-right").addEventListener("pointerdown", () => keys["ArrowRight"] = true);
    document.getElementById("btn-right").addEventListener("pointerup", () => keys["ArrowRight"] = false);

    function getPerspectivePos(normX, z) {
      const y = HORIZON_Y + z * (canvas.height - HORIZON_Y);
      const halfWidth = (ROAD_TOP_W + z * (ROAD_BOTTOM_W - ROAD_TOP_W)) / 2;
      const x = ROAD_CENTER_X + normX * halfWidth;
      const scale = 0.25 + z * 0.95;
      return { x, y, scale };
    }

    function spawnPoop() {
      obstacles.push({
        laneX: (Math.random() * 1.6) - 0.8,
        z: 0.0,
        type: Math.random() > 0.8 ? "big" : "normal"
      });
    }

    // Drawing Helpers (Pixel Art vector rendering)
    function drawSkyAndCity() {
      // Sky
      ctx.fillStyle = "#8fe1ec";
      ctx.fillRect(0, 0, canvas.width, HORIZON_Y);

      // Distant pixel buildings
      ctx.fillStyle = "#6fb8c8";
      ctx.fillRect(200, 150, 45, 90);
      ctx.fillRect(235, 120, 50, 120);
      ctx.fillRect(280, 160, 40, 80);

      // Left brick building
      ctx.fillStyle = "#e08d68";
      ctx.fillRect(0, 70, 130, canvas.height);
      ctx.fillStyle = "#c77553";
      ctx.fillRect(125, 70, 15, canvas.height);
      
      // Building door/windows
      ctx.fillStyle = "#793a20";
      ctx.fillRect(80, 180, 35, 60);
      ctx.fillStyle = "#8cd3e4";
      ctx.fillRect(20, 160, 25, 45);
    }

    function drawSidewalk(offset) {
      // Base sidewalk pavement
      ctx.beginPath();
      ctx.moveTo(ROAD_CENTER_X - ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_BOTTOM_W / 2, canvas.height);
      ctx.lineTo(ROAD_CENTER_X - ROAD_BOTTOM_W / 2, canvas.height);
      ctx.closePath();
      ctx.fillStyle = "#d2c7d9";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#40314f";
      ctx.stroke();

      // Sidewalk Grid Lines (Horizontal moving lines)
      ctx.strokeStyle = "#9c8fa3";
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        let currentZ = ((i / 8) + (offset % (1 / 8)));
        if (currentZ > 0 && currentZ <= 1.0) {
          let p1 = getPerspectivePos(-1, currentZ);
          let p2 = getPerspectivePos(1, currentZ);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      // Vertical sidewalk line down the middle
      let midTop = getPerspectivePos(0, 0);
      let midBot = getPerspectivePos(0, 1);
      ctx.beginPath();
      ctx.moveTo(midTop.x, midTop.y);
      ctx.lineTo(midBot.x, midBot.y);
      ctx.stroke();
    }

    function drawDog(p) {
      const { x, y, scale } = getPerspectivePos(p.laneX, p.z);
      const w = p.size * scale;
      const h = (p.size * 0.9) * scale;

      ctx.save();
      ctx.translate(x, y);

      // Dog Body (White & Black patches)
      ctx.fillStyle = "#f5f5f5";
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.35, w * 0.45, h * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Paws
      ctx.fillStyle = "#fce0db";
      ctx.fillRect(-w * 0.45, -h * 0.08, w * 0.22, h * 0.16);
      ctx.fillRect(w * 0.23, -h * 0.08, w * 0.22, h * 0.16);

      // Black patch over eyes
      ctx.fillStyle = "#2c2d30";
      ctx.beginPath();
      ctx.ellipse(-w * 0.15, -h * 0.52, w * 0.26, h * 0.3, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Ears (Frenchie bat-ears)
      ctx.fillStyle = "#f492a5";
      ctx.beginPath();
      ctx.ellipse(-w * 0.3, -h * 0.85, w * 0.14, h * 0.25, -0.2, 0, Math.PI * 2);
      ctx.ellipse(w * 0.3, -h * 0.85, w * 0.14, h * 0.25, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#2c2d30";
      ctx.lineWidth = 3 * scale;
      ctx.stroke();

      // Tongue / Smile
      ctx.fillStyle = "#ff4f6a";
      ctx.beginPath();
      ctx.arc(0, -h * 0.22, w * 0.12, 0, Math.PI);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(-w * 0.14, -h * 0.5, w * 0.08, 0, Math.PI * 2);
      ctx.arc(w * 0.14, -h * 0.5, w * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(-w * 0.14, -h * 0.5, w * 0.04, 0, Math.PI * 2);
      ctx.arc(w * 0.14, -h * 0.5, w * 0.04, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawPoop(obs) {
      const { x, y, scale } = getPerspectivePos(obs.laneX, obs.z);
      const s = (obs.type === "big" ? 40 : 26) * scale;

      ctx.save();
      ctx.translate(x, y);

      // Poop Swirls
      ctx.fillStyle = "#7b4317";
      ctx.strokeStyle = "#381902";
      ctx.lineWidth = 2 * scale;

      // Base coil
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.7, s * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Mid coil
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.25, s * 0.48, s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Top tip
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.5, s * 0.22, s * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawUI() {
      // Score Box
      ctx.fillStyle = "#000";
      ctx.font = "12px 'Press Start 2P'";
      ctx.fillText(`SCORE:`, 24, 38);
      ctx.font = "18px 'Press Start 2P'";
      ctx.fillText(String(Math.floor(score)).padStart(5, '0'), 24, 62);

      // Level Box
      ctx.font = "12px 'Press Start 2P'";
      ctx.fillText(`LEVEL: ${level}`, 320, 38);

      // Title banner
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffcc00";
      ctx.font = "14px 'Press Start 2P'";
      ctx.shadowColor = "#000";
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillText("PAW PATROL", canvas.width / 2, 35);
      ctx.fillText("PONTIFICATOR", canvas.width / 2, 55);
      ctx.fillStyle = "#fff";
      ctx.font = "8px 'Press Start 2P'";
      ctx.fillText("AVOID THE LANDMINES!", canvas.width / 2, 75);
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.textAlign = "start";
    }

    let roadOffset = 0;

    function update() {
      if (isGameOver) return;

      // Progression & Difficulty
      roadOffset = (roadOffset + speed) % 1.0;
      score += speed * 150;
      level = 1 + Math.floor(score / 500);
      speed = 0.006 + (level * 0.0014);

      // Controls
      if (keys["ArrowLeft"] || keys["a"]) player.laneX -= 0.045;
      if (keys["ArrowRight"] || keys["d"]) player.laneX += 0.045;
      player.laneX = Math.max(-0.85, Math.min(0.85, player.laneX));

      // Spawning
      spawnTimer++;
      const spawnInterval = Math.max(25, 75 - level * 5);
      if (spawnTimer >= spawnInterval) {
        spawnPoop();
        spawnTimer = 0;
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z += speed;

        // Collision Check (when poop is near player depth)
        if (obs.z > 0.82 && obs.z < 0.98) {
          const hitRadius = obs.type === "big" ? 0.25 : 0.16;
          if (Math.abs(obs.laneX - player.laneX) < hitRadius) {
            triggerGameOver();
          }
        }

        // Cleanup off-screen
        if (obs.z > 1.05) {
          obstacles.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawSkyAndCity();
      drawSidewalk(roadOffset);

      // Sort & Draw obstacles
      obstacles.sort((a, b) => a.z - b.z);
      obstacles.forEach(drawPoop);

      // Draw Dog Player
      drawDog(player);

      // Draw Top HUD
      drawUI();
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.innerText = `SCORE: ${Math.floor(score)}`;
      finalLevelEl.innerText = `LEVEL: ${level}`;
      gameOverScreen.style.display = "flex";
    }

    function resetGame() {
      score = 0;
      level = 1;
      speed = 0.006;
      obstacles = [];
      player.laneX = 0;
      isGameOver = false;
      gameOverScreen.style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener("click", resetGame);

    // Initial Start
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>

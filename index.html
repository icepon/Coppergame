<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Paw Patrol Pontificator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #1e2630;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 480px;
      height: 640px;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      border: 4px solid #10161d;
      border-radius: 12px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Controls */
    .touch-controls {
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      background: #ffffff;
      border: 4px solid #111;
      border-radius: 8px;
      width: 66px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #111;
      font-size: 26px;
      color: #111;
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #111;
    }
    /* Game Over Modal */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    #game-over-screen h1 {
      color: #ff3344;
      font-size: 22px;
      margin-bottom: 24px;
      line-height: 1.4;
      text-shadow: 3px 3px 0 #000;
    }
    #game-over-screen p {
      font-size: 13px;
      margin-bottom: 12px;
      color: #eee;
    }
    #restart-btn {
      margin-top: 24px;
      font-family: inherit;
      background: #ffcc00;
      border: 3px solid #000;
      padding: 14px 28px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 4px 0 #000;
    }
    #restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    
    <div class="touch-controls">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>

    <div id="game-over-screen">
      <h1>STEPPED ON POOP!</h1>
      <p id="final-score">SCORE: 0</p>
      <p id="final-bones">BONES: 0</p>
      <p id="final-level">LEVEL: 1</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");
    const finalBonesEl = document.getElementById("final-bones");
    const finalLevelEl = document.getElementById("final-level");
    const restartBtn = document.getElementById("restart-btn");

    // Perspective Projection Config
    const HORIZON_Y = 240; 
    const ROAD_TOP_W = 140;
    const ROAD_BOTTOM_W = 440;
    const ROAD_CENTER_X = 240;

    let score = 0;
    let bonesCollected = 0;
    let level = 1;
    let speed = 0.0065;
    let isGameOver = false;
    let tickCount = 0;

    // Player State
    const player = {
      laneX: 0,
      z: 0.90,
      size: 110 // ขนาดสเกลหมาใหญ่ชัดเจน
    };

    // Entities & Floating Texts
    let obstacles = [];
    let floatingTexts = [];
    let spawnTimer = 0;

    // Input handlers
    const keys = {};
    window.addEventListener("keydown", (e) => { keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    document.getElementById("btn-left").addEventListener("pointerdown", () => keys["ArrowLeft"] = true);
    document.getElementById("btn-left").addEventListener("pointerup", () => keys["ArrowLeft"] = false);
    document.getElementById("btn-right").addEventListener("pointerdown", () => keys["ArrowRight"] = true);
    document.getElementById("btn-right").addEventListener("pointerup", () => keys["ArrowRight"] = false);

    function getPerspectivePos(normX, z) {
      const y = HORIZON_Y + z * (canvas.height - HORIZON_Y);
      const halfWidth = (ROAD_TOP_W + z * (ROAD_BOTTOM_W - ROAD_TOP_W)) / 2;
      const x = ROAD_CENTER_X + normX * halfWidth;
      const scale = 0.2 + z * 0.95;
      return { x, y, scale };
    }

    // Spawner (อึ หรือ กระดูก)
    function spawnEntity() {
      const laneX = (Math.random() * 1.5) - 0.75;
      const rand = Math.random();

      if (rand < 0.60) {
        // กองอึ
        obstacles.push({
          kind: 'poop',
          laneX: laneX,
          z: 0.0,
          type: Math.random() > 0.8 ? "big" : "normal"
        });
      } else {
        // กระดูก (ขาว +50 หรือ ทอง +100)
        const isGold = Math.random() > 0.65;
        obstacles.push({
          kind: 'bone',
          laneX: laneX,
          z: 0.0,
          boneType: isGold ? 'gold' : 'white',
          value: isGold ? 100 : 50
        });
      }
    }

    function addScoreFloat(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, alpha: 1.0 });
    }

    // ----------------- DRAWING METHODS -----------------

    function drawBackground() {
      // Sky
      ctx.fillStyle = "#8fe1ec";
      ctx.fillRect(0, 0, canvas.width, HORIZON_Y);

      // Distant City
      ctx.fillStyle = "#6eb8c8";
      ctx.fillRect(200, 150, 45, 90);
      ctx.fillRect(240, 120, 55, 120);
      ctx.fillRect(295, 160, 40, 80);

      // Left brick building
      ctx.fillStyle = "#e08c68";
      ctx.fillRect(0, 60, 135, canvas.height);
      ctx.fillStyle = "#ba6c4c";
      ctx.fillRect(130, 60, 15, canvas.height);
      
      // Building details
      ctx.fillStyle = "#692e15";
      ctx.fillRect(80, 175, 35, 65);
      ctx.fillStyle = "#98e3f5";
      ctx.fillRect(20, 140, 30, 50);

      // Sign: No Pooping
      ctx.fillStyle = "#fff";
      ctx.fillRect(18, 230, 44, 52);
      ctx.strokeStyle = "#c00";
      ctx.lineWidth = 3;
      ctx.strokeRect(18, 230, 44, 52);
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(40, 256, 14, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawSidewalk(offset) {
      // Sidewalk polygon
      ctx.beginPath();
      ctx.moveTo(ROAD_CENTER_X - ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_BOTTOM_W / 2, canvas.height);
      ctx.lineTo(ROAD_CENTER_X - ROAD_BOTTOM_W / 2, canvas.height);
      ctx.closePath();
      ctx.fillStyle = "#d3c8d8";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#40314f";
      ctx.stroke();

      // Horizontal Tiles
      ctx.strokeStyle = "#9d8ea4";
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        let currentZ = ((i / 9) + (offset % (1 / 9)));
        if (currentZ > 0 && currentZ <= 1.0) {
          let p1 = getPerspectivePos(-1.0, currentZ);
          let p2 = getPerspectivePos(1.0, currentZ);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      // Middle dividing line
      let midTop = getPerspectivePos(0, 0);
      let midBot = getPerspectivePos(0, 1);
      ctx.beginPath();
      ctx.moveTo(midTop.x, midTop.y);
      ctx.lineTo(midBot.x, midBot.y);
      ctx.stroke();
    }

    // วาดสุนัข French Bulldog (Pied) ตรงตามต้นแบบ
    function drawDog(p) {
      const { x, y, scale } = getPerspectivePos(p.laneX, p.z);
      const w = p.size * scale;
      const h = p.size * scale;
      
      // Animation เด้งดึ๋งเล็กน้อยขณะวิ่ง
      const bounce = Math.sin(tickCount * 0.3) * (3 * scale);

      ctx.save();
      ctx.translate(x, y + bounce);

      // เงาใต้ตัวหมา
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.beginPath();
      ctx.ellipse(0, 8 * scale, w * 0.45, h * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // ลำตัวสีขาว (มีแต้มดำด้านหลัง)
      ctx.fillStyle = "#2c2d33"; // แต้มดำหลัง
      ctx.beginPath();
      ctx.ellipse(-w * 0.22, -h * 0.28, w * 0.25, h * 0.26, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1b1c1e";
      ctx.lineWidth = 3.5 * scale;
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.32, w * 0.42, h * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // ขาหน้า 2 ข้างพร้อมอุ้งเท้าสีชมพู
      ctx.fillStyle = "#ffffff";
      // ขาซ้าย
      ctx.beginPath();
      ctx.ellipse(-w * 0.26, -h * 0.08, w * 0.13, h * 0.16, 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // ขวา
      ctx.beginPath();
      ctx.ellipse(w * 0.26, -h * 0.08, w * 0.13, h * 0.16, -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // เล็บ / ปลายอุ้งชมพูอ่อน
      ctx.fillStyle = "#fbc8c8";
      ctx.fillRect(-w * 0.34, -h * 0.02, w * 0.16, h * 0.05);
      ctx.fillRect(w * 0.18, -h * 0.02, w * 0.16, h * 0.05);

      // --- หูเฟรนช์ชี่ทรง Bat-Ears ตั้งตรง ---
      function drawEar(isLeft) {
        ctx.save();
        ctx.translate(isLeft ? -w * 0.28 : w * 0.28, -h * 0.78);
        ctx.rotate(isLeft ? -0.22 : 0.22);
        // กรอบนอกหู
        ctx.fillStyle = isLeft ? "#222326" : "#ffffff";
        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.16, h * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // ด้านในหูสีชมพู
        ctx.fillStyle = "#f89db1";
        ctx.beginPath();
        ctx.ellipse(0, 2 * scale, w * 0.09, h * 0.19, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      drawEar(true);
      drawEar(false);

      // --- หัวหมา French Bulldog ---
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.50, w * 0.44, h * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // ปื้นดำคาดหน้าฝั่งซ้าย (Pied Pattern)
      ctx.fillStyle = "#25272d";
      ctx.beginPath();
      ctx.ellipse(-w * 0.16, -h * 0.53, w * 0.24, h * 0.29, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // แก้มกลมอวบสีขาวฝั่งขวา
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(w * 0.14, -h * 0.40, w * 0.16, 0, Math.PI * 2);
      ctx.fill();

      // ตาโตกลมดำ 2 ข้าง
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(-w * 0.16, -h * 0.52, w * 0.08, 0, Math.PI * 2);
      ctx.arc(w * 0.16, -h * 0.52, w * 0.08, 0, Math.PI * 2);
      ctx.fill();

      // ประกายตาสีขาว (Cute Eyes)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-w * 0.18, -h * 0.54, w * 0.03, 0, Math.PI * 2);
      ctx.arc(w * 0.14, -h * 0.54, w * 0.03, 0, Math.PI * 2);
      ctx.fill();

      // จมูกหมาร่น สีดำ
      ctx.fillStyle = "#1e1e20";
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.42, w * 0.09, h * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();

      // ปากยิ้มกว้าง & ลิ้นชมพูแลบออกมา
      ctx.fillStyle = "#2c0e14";
      ctx.beginPath();
      ctx.arc(0, -h * 0.35, w * 0.18, 0, Math.PI);
      ctx.fill();
      ctx.stroke();

      // ลิ้นสีชมพู
      ctx.fillStyle = "#ff5577";
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.31, w * 0.10, h * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // วาดกองอึ
    function drawPoop(obs) {
      const { x, y, scale } = getPerspectivePos(obs.laneX, obs.z);
      const s = (obs.type === "big" ? 44 : 30) * scale;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#7b4114";
      ctx.strokeStyle = "#381c06";
      ctx.lineWidth = 2.5 * scale;

      // Base coil
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.72, s * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Mid coil
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.28, s * 0.50, s * 0.23, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Top swirl
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.54, s * 0.24, s * 0.17, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // วาดไอเทมกระดูก (Bone: ขาว หรือ ทอง)
    function drawBone(obs) {
      const { x, y, scale } = getPerspectivePos(obs.laneX, obs.z);
      const isGold = obs.boneType === 'gold';
      const w = (isGold ? 36 : 28) * scale;
      const h = (isGold ? 16 : 13) * scale;

      ctx.save();
      ctx.translate(x, y - 6 * scale);

      // เอฟเฟกต์ประกายสีทอง
      if (isGold) {
        ctx.shadowColor = "#ffea00";
        ctx.shadowBlur = 12 * scale;
      }

      ctx.fillStyle = isGold ? "#ffe033" : "#f4f4f4";
      ctx.strokeStyle = isGold ? "#965b00" : "#555555";
      ctx.lineWidth = 2.5 * scale;

      // แท่งกลางกระดูก
      ctx.fillRect(-w * 0.35, -h * 0.22, w * 0.7, h * 0.44);
      ctx.strokeRect(-w * 0.35, -h * 0.22, w * 0.7, h * 0.44);

      // ปลายกระดูก 4 วงกลม (ซ้ายบน-ล่าง ขวาบน-ล่าง)
      const r = h * 0.38;
      const ends = [
        [-w * 0.35, -h * 0.22],
        [-w * 0.35, h * 0.22],
        [w * 0.35, -h * 0.22],
        [w * 0.35, h * 0.22]
      ];

      ends.forEach(([ex, ey]) => {
        ctx.beginPath();
        ctx.arc(ex, ey, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      ctx.restore();
    }

    // ข้อความคะแนนลอยขึ้น
    function drawFloatingTexts() {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ctx.save();
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.font = "14px 'Press Start 2P'";
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.restore();

        ft.y -= 1.8;
        ft.alpha -= 0.025;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    // UI ด้านบน
    function drawUI() {
      // กล่องคะแนน
      ctx.fillStyle = "#000";
      ctx.font = "11px 'Press Start 2P'";
      ctx.fillText(`SCORE`, 22, 34);
      ctx.font = "16px 'Press Start 2P'";
      ctx.fillText(String(Math.floor(score)).padStart(5, '0'), 22, 56);

      // กระดูกที่เก็บได้
      ctx.font = "10px 'Press Start 2P'";
      ctx.fillStyle = "#ffcc00";
      ctx.fillText(`🦴 ${bonesCollected}`, 22, 80);

      // Level
      ctx.fillStyle = "#000";
      ctx.font = "11px 'Press Start 2P'";
      ctx.fillText(`LEVEL: ${level}`, 320, 34);

      // โลโก้เกมกลางจอ
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffcc00";
      ctx.font = "13px 'Press Start 2P'";
      ctx.shadowColor = "#000";
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillText("PAW PATROL", canvas.width / 2, 34);
      ctx.fillText("PONTIFICATOR", canvas.width / 2, 54);
      ctx.fillStyle = "#ffffff";
      ctx.font = "8px 'Press Start 2P'";
      ctx.fillText("AVOID POOP & GET BONES!", canvas.width / 2, 74);
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.textAlign = "start";
    }

    // ----------------- GAME LOOP -----------------

    let roadOffset = 0;

    function update() {
      if (isGameOver) return;
      tickCount++;

      roadOffset = (roadOffset + speed) % 1.0;
      score += speed * 120; // ได้คะแนนตามระยะทาง
      level = 1 + Math.floor(score / 500);
      speed = 0.0065 + (level * 0.0012);

      // บังคับทิศทาง
      if (keys["ArrowLeft"] || keys["a"]) player.laneX -= 0.045;
      if (keys["ArrowRight"] || keys["d"]) player.laneX += 0.045;
      player.laneX = Math.max(-0.85, Math.min(0.85, player.laneX));

      // สร้างอุปสรรค / ไอเทม
      spawnTimer++;
      const spawnInterval = Math.max(22, 65 - level * 4);
      if (spawnTimer >= spawnInterval) {
        spawnEntity();
        spawnTimer = 0;
      }

      // ตรวจสอบตำแหน่ง Entity
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ent = obstacles[i];
        ent.z += speed;

        // ชนเมื่อ z ใกล้เคียงตัวผู้เล่น
        if (ent.z > 0.80 && ent.z < 0.96) {
          const hitRadius = ent.kind === 'poop' ? (ent.type === 'big' ? 0.26 : 0.17) : 0.19;
          
          if (Math.abs(ent.laneX - player.laneX) < hitRadius) {
            if (ent.kind === 'poop') {
              triggerGameOver();
              return;
            } else if (ent.kind === 'bone') {
              // เก็บกระดูกสำเร็จ!
              score += ent.value;
              bonesCollected++;
              const pos = getPerspectivePos(ent.laneX, ent.z);
              addScoreFloat(pos.x, pos.y, `+${ent.value}`, ent.boneType === 'gold' ? '#ffe033' : '#ffffff');
              obstacles.splice(i, 1);
              continue;
            }
          }
        }

        // ลบเมื่อหลุดจอ
        if (ent.z > 1.05) {
          obstacles.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawSidewalk(roadOffset);

      // วาด Entity ตามลำดับความลึก (Z-Sorting)
      obstacles.sort((a, b) => a.z - b.z);
      obstacles.forEach(ent => {
        if (ent.kind === 'poop') drawPoop(ent);
        else if (ent.kind === 'bone') drawBone(ent);
      });

      // วาดตัวละครหมา
      drawDog(player);

      // เอฟเฟกต์แต้มลอย
      drawFloatingTexts();

      // UI
      drawUI();
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.innerText = `SCORE: ${Math.floor(score)}`;
      finalBonesEl.innerText = `BONES: ${bonesCollected}`;
      finalLevelEl.innerText = `LEVEL: ${level}`;
      gameOverScreen.style.display = "flex";
    }

    function resetGame() {
      score = 0;
      bonesCollected = 0;
      level = 1;
      speed = 0.0065;
      obstacles = [];
      floatingTexts = [];
      player.laneX = 0;
      isGameOver = false;
      gameOverScreen.style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener("click", resetGame);

    // เริ่มเกม
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>

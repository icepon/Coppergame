<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paw Patrol Pontificator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      background: #1e1e24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      width: 440px;
      height: 600px;
      border: 4px solid #111;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: #8e9eab;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .touch-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      pointer-events: none;
    }
    .btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid #222;
      border-radius: 10px;
      font-size: 26px;
      font-weight: bold;
      width: 65px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px #111;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px #111;
      background: #ffd154;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="440" height="600"></canvas>
  <div class="touch-controls">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-right">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Web Audio API Synth ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'bone') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(783.99, now + 0.08);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
  } else if (type === 'crash') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'bark') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(350, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }
}

// --- การตั้งค่าความเร็วและสมดุลเกมใหม่ ---
const INITIAL_SPEED = 3.2; // ความเร็วเริ่มต้นสบายๆ
const MAX_SPEED = 10.0;    // ล็อกความเร็วสูงสุดไม่ให้เร็วเกินไป

let state = 'PLAY';
let score = 0;
let level = 1;
let speed = INITIAL_SPEED;
let frameCount = 0;
let shakeTime = 0;

const dog = {
  x: 220,
  y: 480,
  speed: 5.8,
  moveLeft: false,
  moveRight: false
};

const poops = [];
const bones = [];
const particles = [];
const floatingTexts = [];

let poopSpawnTimer = 0;
let boneSpawnTimer = 0;

function drawEnvironment() {
  ctx.fillStyle = '#8f9fa9';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#c5a089';
  ctx.fillRect(0, 0, 30, canvas.height);
  ctx.fillRect(canvas.width - 30, 0, 30, canvas.height);

  ctx.strokeStyle = '#76858e';
  ctx.lineWidth = 2;
  const tileOffset = (frameCount * speed) % 60;
  for (let y = -60; y < canvas.height; y += 60) {
    ctx.beginPath();
    ctx.moveTo(30, y + tileOffset);
    ctx.lineTo(canvas.width - 30, y + tileOffset);
    ctx.stroke();
  }

  ctx.strokeStyle = '#374149';
  ctx.lineWidth = 4;
  ctx.strokeRect(30, -5, canvas.width - 60, canvas.height + 10);
}

function drawFrenchie(x, y, frame) {
  ctx.save();
  ctx.translate(x, y);

  const bob = Math.sin(frame * 0.25) * 2.5;

  // หู
  ctx.fillStyle = '#e88ba5';
  ctx.fillRect(-22, -34 + bob, 12, 20);
  ctx.fillRect(10, -34 + bob, 12, 20);
  ctx.strokeStyle = '#1e1e24';
  ctx.lineWidth = 3.5;
  ctx.strokeRect(-22, -34 + bob, 12, 20);
  ctx.strokeRect(10, -34 + bob, 12, 20);

  // ลำตัว
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(-20, -10 + bob, 40, 32);
  ctx.fillStyle = '#222';
  ctx.fillRect(-20, -6 + bob, 18, 20);

  // ขา
  const legOffset = Math.sin(frame * 0.35) * 5;
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(-22, 18 + legOffset, 12, 14);
  ctx.fillRect(10, 18 - legOffset, 12, 14);

  // หัว
  ctx.fillStyle = '#222';
  ctx.fillRect(-24, -26 + bob, 48, 28);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-6, -26 + bob, 12, 28);

  // หน้า ปาก ลิ้น
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-14, -8 + bob, 28, 16);
  ctx.fillStyle = '#111';
  ctx.fillRect(-5, -6 + bob, 10, 6);
  ctx.fillStyle = '#ff5b79';
  ctx.fillRect(-4, 2 + bob, 8, 5);

  // ตา
  ctx.fillStyle = '#000';
  ctx.fillRect(-16, -18 + bob, 6, 8);
  ctx.fillRect(10, -18 + bob, 6, 8);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-14, -18 + bob, 2, 3);
  ctx.fillRect(12, -18 + bob, 2, 3);

  ctx.restore();
}

function drawPoop(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = '#6a3805';
  ctx.beginPath();
  ctx.roundRect(-p.w / 2, 0, p.w, 14, [6]);
  ctx.fill();

  ctx.fillStyle = '#7a4209';
  ctx.beginPath();
  ctx.roundRect(-p.w / 2 + 5, -10, p.w - 10, 12, [5]);
  ctx.fill();

  ctx.fillStyle = '#8a4c0d';
  ctx.beginPath();
  ctx.arc(0, -13, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBone(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;

  ctx.fillRect(-12, -4, 24, 8);
  ctx.strokeRect(-12, -4, 24, 8);

  [-12, 12].forEach(ox => {
    [-4, 4].forEach(oy => {
      ctx.beginPath();
      ctx.arc(ox, oy, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.stroke();
    });
  });
  ctx.restore();
}

function drawUI() {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.fillRect(12, 12, 130, 48);
  ctx.fillRect(canvas.width - 142, 12, 130, 48);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3;
  ctx.strokeRect(12, 12, 130, 48);
  ctx.strokeRect(canvas.width - 142, 12, 130, 48);

  ctx.fillStyle = '#111';
  ctx.font = 'bold 12px Courier New';
  ctx.fillText('SCORE:', 20, 30);
  ctx.font = 'bold 18px Courier New';
  ctx.fillText(String(Math.floor(score)).padStart(5, '0'), 20, 50);

  ctx.font = 'bold 12px Courier New';
  ctx.fillText('LEVEL:', canvas.width - 134, 30);
  ctx.font = 'bold 18px Courier New';
  ctx.fillText(`LVL ${level}`, canvas.width - 134, 50);

  // Speedometer
  const gx = canvas.width - 50;
  const gy = 105;
  ctx.beginPath();
  ctx.arc(gx, gy, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#1e1e24';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // ปรับการคำนวณเข็มความเร็วให้สอดคล้องกับ Max Speed
  const currentRatio = (speed - INITIAL_SPEED) / (MAX_SPEED - INITIAL_SPEED);
  const angle = -Math.PI * 0.8 + Math.min(Math.max(currentRatio, 0), 1) * Math.PI * 1.6;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx + Math.cos(angle) * 22, gy + Math.sin(angle) * 22);
  ctx.strokeStyle = '#ff3b30';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function update() {
  if (state === 'PLAY') {
    frameCount++;
    score += speed * 0.035;

    // --- การค่อยๆ เร่งความเร็วแบบนุ่มนวล ---
    // เพิ่มความเร็วทีละน้อยมาก (ทุกๆ 500 คะแนน จะเร็วขึ้น 0.6 และไม่เกิน MAX_SPEED)
    speed = Math.min(MAX_SPEED, INITIAL_SPEED + (score / 500) * 0.6);
    level = 1 + Math.floor(score / 450);

    // ละอองฝุ่น
    if (frameCount % 6 === 0) {
      particles.push({
        x: dog.x + (Math.random() * 20 - 10),
        y: dog.y + 28,
        r: 2.5 + Math.random() * 2.5,
        alpha: 0.9
      });
    }

    if (dog.moveLeft && dog.x > 55) dog.x -= dog.speed;
    if (dog.moveRight && dog.x < canvas.width - 55) dog.x += dog.speed;

    // สุ่มเสกอึ (ระยะห่างขึ้นกับความเร็ว ไม่ถี่เกินไป)
    poopSpawnTimer++;
    const poopInterval = Math.max(38, Math.floor(95 - (speed - INITIAL_SPEED) * 5));
    if (poopSpawnTimer >= poopInterval) {
      poopSpawnTimer = 0;
      poops.push({
        x: 60 + Math.random() * (canvas.width - 120),
        y: -30,
        w: 30 + Math.random() * 8,
        h: 22
      });
    }

    // เสกกระดูก
    boneSpawnTimer++;
    if (boneSpawnTimer >= 170) {
      boneSpawnTimer = 0;
      bones.push({
        x: 65 + Math.random() * (canvas.width - 130),
        y: -30
      });
    }

    // ตรวจจับกระดูก
    for (let i = bones.length - 1; i >= 0; i--) {
      const b = bones[i];
      b.y += speed;

      if (Math.hypot(dog.x - b.x, dog.y - b.y) < 32) {
        score += 50;
        playSound('bone');
        floatingTexts.push({ x: b.x, y: b.y, text: '+50', alpha: 1 });
        bones.splice(i, 1);
        continue;
      }
      if (b.y > canvas.height + 40) bones.splice(i, 1);
    }

    // ตรวจสอบการชนกองอึ
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.y += speed;

      if (Math.hypot(dog.x - p.x, (dog.y - 8) - p.y) < 25) {
        playSound('crash');
        shakeTime = 18;
        state = 'GAMEOVER';
      }
      if (p.y > canvas.height + 40) poops.splice(i, 1);
    }
  }

  // Effect ฝุ่นจาง
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].y += speed * 0.3;
    particles[i].alpha -= 0.04;
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }

  // ข้อความลอย +50
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 1.2;
    floatingTexts[i].alpha -= 0.03;
    if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
  }

  if (shakeTime > 0) shakeTime--;
}

function draw() {
  ctx.save();
  if (shakeTime > 0) {
    const ox = (Math.random() - 0.5) * 8;
    const oy = (Math.random() - 0.5) * 8;
    ctx.translate(ox, oy);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawEnvironment();

  particles.forEach(pt => {
    ctx.fillStyle = `rgba(220, 220, 220, ${pt.alpha})`;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
    ctx.fill();
  });

  bones.forEach(b => drawBone(b));
  poops.forEach(p => drawPoop(p));
  drawFrenchie(dog.x, dog.y, frameCount);

  floatingTexts.forEach(ft => {
    ctx.fillStyle = `rgba(255, 230, 0, ${ft.alpha})`;
    ctx.font = 'bold 20px Courier New';
    ctx.fillText(ft.text, ft.x - 15, ft.y);
  });

  drawUI();

  if (state === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Courier New';
    ctx.fillText('GAME OVER!', canvas.width / 2, 270);

    ctx.fillStyle = '#fff';
    ctx.font = '16px Courier New';
    ctx.fillText(`Final Score: ${Math.floor(score)}`, canvas.width / 2, 310);
    ctx.fillText('Tap Screen or Press SPACE', canvas.width / 2, 350);
    ctx.textAlign = 'start';
  }
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function resetGame() {
  initAudio();
  playSound('bark');
  score = 0;
  level = 1;
  speed = INITIAL_SPEED;
  dog.x = 220;
  poops.length = 0;
  bones.length = 0;
  state = 'PLAY';
}

window.addEventListener('keydown', (e) => {
  initAudio();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') dog.moveLeft = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') dog.moveRight = true;
  if (e.code === 'Space' && state === 'GAMEOVER') resetGame();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') dog.moveLeft = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') dog.moveRight = false;
});

const leftBtn = document.getElementById('btn-left');
const rightBtn = document.getElementById('btn-right');

['pointerdown', 'touchstart'].forEach(evt => {
  leftBtn.addEventListener(evt, (e) => { e.preventDefault(); initAudio(); dog.moveLeft = true; });
  rightBtn.addEventListener(evt, (e) => { e.preventDefault(); initAudio(); dog.moveRight = true; });
});

['pointerup', 'touchend', 'pointercancel'].forEach(evt => {
  leftBtn.addEventListener(evt, () => dog.moveLeft = false);
  rightBtn.addEventListener(evt, () => dog.moveRight = false);
});

canvas.addEventListener('click', () => {
  initAudio();
  if (state === 'GAMEOVER') resetGame();
});

loop();
</script>
</body>
</html>

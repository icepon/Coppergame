<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Paw Patrol Pontificator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #182026;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 440px;
      height: 640px;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      border: 4px solid #111;
      border-radius: 12px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Controls */
    .touch-controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      background: #ffffff;
      border: 3px solid #111;
      border-radius: 8px;
      width: 64px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #111;
      font-size: 24px;
      color: #111;
    }
    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #111;
    }
    #gyro-btn {
      position: absolute;
      top: 105px;
      right: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffcc00;
      color: #ffcc00;
      font-family: inherit;
      font-size: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 5;
    }
    /* Game Over Modal */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    #game-over-screen h1 {
      color: #ff3344;
      font-size: 20px;
      margin-bottom: 20px;
      line-height: 1.4;
      text-shadow: 2px 2px 0 #000;
    }
    #game-over-screen p {
      font-size: 12px;
      margin-bottom: 12px;
      color: #eee;
    }
    #restart-btn {
      margin-top: 20px;
      font-family: inherit;
      background: #ffcc00;
      border: 3px solid #000;
      padding: 12px 24px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      box-shadow: 0 4px 0 #000;
    }
    #restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #000;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="440" height="640"></canvas>
    <button id="gyro-btn">ENABLE TILT 📳</button>
    
    <div class="touch-controls">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>

    <div id="game-over-screen">
      <h1>STEPPED ON POOP!</h1>
      <p id="final-score">SCORE: 0</p>
      <p id="final-bones">BONES: 0</p>
      <p id="final-level">LEVEL: 1</p>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameOverScreen = document.getElementById("game-over-screen");
    const finalScoreEl = document.getElementById("final-score");
    const finalBonesEl = document.getElementById("final-bones");
    const finalLevelEl = document.getElementById("final-level");
    const restartBtn = document.getElementById("restart-btn");
    const gyroBtn = document.getElementById("gyro-btn");

    // Perspective Config
    const HORIZON_Y = 240; 
    const ROAD_TOP_W = 120;
    const ROAD_BOTTOM_W = 400;
    const ROAD_CENTER_X = 220;

    let score = 0;
    let bonesCollected = 0;
    let level = 1;
    let speed = 0.006;
    let isGameOver = false;
    let tickCount = 0;

    // Player State (ปรับขนาดให้กระทัดรัดน่ารัก ไม่บังเลน)
    const player = {
      x: 0,
      targetX: 0,
      vx: 0,
      z: 0.88,
      size: 68,
      tiltAngle: 0
    };

    let obstacles = [];
    let floatingTexts = [];
    let spawnTimer = 0;

    // Smooth Control Variables
    const keys = { left: false, right: false };
    let gyroOffset = 0;
    let gyroActive = false;

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    // Touch Buttons with continuous press
    const leftBtn = document.getElementById("btn-left");
    const rightBtn = document.getElementById("btn-right");

    leftBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); keys.left = true; });
    window.addEventListener("pointerup", () => { keys.left = false; keys.right = false; });
    rightBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); keys.right = true; });

    // Gyroscope Setup
    function handleOrientation(e) {
      if (e.gamma !== null) {
        // gamma: ซ้ายลบ ขวาบวก (-45 ถึง 45 องศา)
        const tilt = Math.max(-30, Math.min(30, e.gamma));
        gyroOffset = tilt / 30; // -1 ถึง 1
        gyroActive = true;
      }
    }

    gyroBtn.addEventListener("click", () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              gyroBtn.style.display = "none";
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        gyroBtn.style.display = "none";
      }
    });

    function getPerspectivePos(normX, z) {
      const y = HORIZON_Y + z * (canvas.height - HORIZON_Y);
      const halfWidth = (ROAD_TOP_W + z * (ROAD_BOTTOM_W - ROAD_TOP_W)) / 2;
      const x = ROAD_CENTER_X + normX * halfWidth;
      const scale = 0.22 + z * 0.95;
      return { x, y, scale };
    }

    function spawnEntity() {
      const laneX = (Math.random() * 1.5) - 0.75;
      const rand = Math.random();

      if (rand < 0.62) {
        obstacles.push({
          kind: 'poop',
          laneX: laneX,
          z: 0.0,
          type: Math.random() > 0.82 ? "big" : "normal"
        });
      } else {
        const isGold = Math.random() > 0.65;
        obstacles.push({
          kind: 'bone',
          laneX: laneX,
          z: 0.0,
          boneType: isGold ? 'gold' : 'white',
          value: isGold ? 100 : 50
        });
      }
    }

    function addScoreFloat(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, alpha: 1.0 });
    }

    // ----------------- RENDERING -----------------

    function drawBackground() {
      ctx.fillStyle = "#8fe1ec";
      ctx.fillRect(0, 0, canvas.width, HORIZON_Y);

      // Distant buildings
      ctx.fillStyle = "#6fb8c8";
      ctx.fillRect(180, 150, 45, 90);
      ctx.fillRect(225, 120, 50, 120);
      ctx.fillRect(275, 160, 40, 80);

      // Left building
      ctx.fillStyle = "#e08c68";
      ctx.fillRect(0, 60, 120, canvas.height);
      ctx.fillStyle = "#ba6c4c";
      ctx.fillRect(115, 60, 15, canvas.height);
    }

    function drawSidewalk(offset) {
      ctx.beginPath();
      ctx.moveTo(ROAD_CENTER_X - ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_TOP_W / 2, HORIZON_Y);
      ctx.lineTo(ROAD_CENTER_X + ROAD_BOTTOM_W / 2, canvas.height);
      ctx.lineTo(ROAD_CENTER_X - ROAD_BOTTOM_W / 2, canvas.height);
      ctx.closePath();
      ctx.fillStyle = "#d4cad9";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#40314f";
      ctx.stroke();

      ctx.strokeStyle = "#9d8ea4";
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        let currentZ = ((i / 9) + (offset % (1 / 9)));
        if (currentZ > 0 && currentZ <= 1.0) {
          let p1 = getPerspectivePos(-1.0, currentZ);
          let p2 = getPerspectivePos(1.0, currentZ);
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      let midTop = getPerspectivePos(0, 0);
      let midBot = getPerspectivePos(0, 1);
      ctx.beginPath();
      ctx.moveTo(midTop.x, midTop.y);
      ctx.lineTo(midBot.x, midBot.y);
      ctx.stroke();
    }

    // วาดน้องหมา French Bulldog สัดส่วนน่ารัก ตรงตามภาพจริง
    function drawDog(p) {
      const { x, y, scale } = getPerspectivePos(p.x, p.z);
      const s = p.size * scale;
      const bounce = Math.sin(tickCount * 0.35) * (2.5 * scale);

      ctx.save();
      ctx.translate(x, y + bounce);
      ctx.rotate(p.tiltAngle);

      // เงา
      ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
      ctx.beginPath();
      ctx.ellipse(0, s * 0.46, s * 0.45, s * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();

      // ลำตัวสีขาว มีแต้มดำด้านหลังฝั่งขวาตามรูปจริง
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = 2.5 * scale;
      ctx.beginPath();
      ctx.ellipse(0, s * 0.1, s * 0.34, s * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // จุดแต้มสีดำบนหลัง
      ctx.fillStyle = "#1d1d20";
      ctx.beginPath();
      ctx.ellipse(s * 0.18, s * 0.05, s * 0.16, s * 0.18, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // ขาหน้า 2 ข้าง
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-s * 0.22, s * 0.36, s * 0.09, 0, Math.PI * 2);
      ctx.arc(s * 0.22, s * 0.36, s * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // --- หูทรงตั้งใหญ่ (Bat Ears) ดำล้วน ชมพูด้านใน ---
      function drawBatEar(isLeft) {
        ctx.save();
        ctx.translate(isLeft ? -s * 0.28 : s * 0.28, -s * 0.34);
        ctx.rotate(isLeft ? -0.18 : 0.18);
        ctx.fillStyle = "#1e1e21";
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.14, s * 0.26, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // ภายในหูชมพูอ่อน
        ctx.fillStyle = "#f5a6b8";
        ctx.beginPath();
        ctx.ellipse(0, s * 0.03, s * 0.07, s * 0.17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      drawBatEar(true);
      drawBatEar(false);

      // --- หัวหมา Frenchie ทรงกลมกระชับ ---
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, -s * 0.08, s * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // มาร์กกิ้งสีดำ 2 ฝั่งรอบตา (Mask)
      ctx.fillStyle = "#1f1f23";
      // ซ้าย
      ctx.beginPath();
      ctx.ellipse(-s * 0.18, -s * 0.12, s * 0.18, s * 0.22, -0.1, 0, Math.PI * 2);
      ctx.fill();
      // ขวา
      ctx.beginPath();
      ctx.ellipse(s * 0.18, -s * 0.12, s * 0.18, s * 0.22, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // แถบคาดสีขาวตรงกลางหน้าผาก (Blaze)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(-s * 0.06, -s * 0.4);
      ctx.lineTo(s * 0.06, -s * 0.4);
      ctx.lineTo(s * 0.09, -s * 0.04);
      ctx.lineTo(-s * 0.09, -s * 0.04);
      ctx.closePath();
      ctx.fill();

      // ปากและแก้มขาวอวบ (Muzzle)
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.22, s * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();

      // ตากลมโตสีดำเป็นประกายแบบรูปต้นฉบับ
      ctx.fillStyle = "#0a0a0c";
      ctx.beginPath();
      ctx.arc(-s * 0.18, -s * 0.12, s * 0.07, 0, Math.PI * 2);
      ctx.arc(s * 0.18, -s * 0.12, s * 0.07, 0, Math.PI * 2);
      ctx.fill();

      // ประกายตา
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-s * 0.20, -s * 0.14, s * 0.025, 0, Math.PI * 2);
      ctx.arc(s * 0.16, -s * 0.14, s * 0.025, 0, Math.PI * 2);
      ctx.fill();

      // จมูกหมาร่นสีดำ
      ctx.fillStyle = "#1a1a1d";
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.02, s * 0.08, s * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();

      // รอยยิ้มเปิดปากเห็นฟันล่าง (เอกลักษณ์ตามรูป)
      ctx.fillStyle = "#2c0e12";
      ctx.beginPath();
      ctx.arc(0, s * 0.06, s * 0.12, 0, Math.PI);
      ctx.fill();

      // ฟันล่างเล็กๆ น่ารัก
      ctx.fillStyle = "#ffffff";
      for (let f = -3; f <= 3; f += 2) {
        ctx.fillRect(f * (s * 0.022) - (s * 0.01), s * 0.11, s * 0.02, s * 0.035);
      }

      ctx.restore();
    }

    function drawPoop(obs) {
      const { x, y, scale } = getPerspectivePos(obs.laneX, obs.z);
      const s = (obs.type === "big" ? 34 : 24) * scale;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#743a0e";
      ctx.strokeStyle = "#381702";
      ctx.lineWidth = 2 * scale;

      // กองอึ 3 ชั้น
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.7, s * 0.3, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -s * 0.25, s * 0.48, s * 0.22, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -s * 0.5, s * 0.22, s * 0.16, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      ctx.restore();
    }

    function drawBone(obs) {
      const { x, y, scale } = getPerspectivePos(obs.laneX, obs.z);
      const isGold = obs.boneType === 'gold';
      const w = (isGold ? 30 : 24) * scale;
      const h = (isGold ? 14 : 11) * scale;

      ctx.save();
      ctx.translate(x, y - 4 * scale);

      if (isGold) {
        ctx.shadowColor = "#ffe600";
        ctx.shadowBlur = 10 * scale;
      }

      ctx.fillStyle = isGold ? "#ffcc00" : "#f5f5f5";
      ctx.strokeStyle = isGold ? "#8a5800" : "#555";
      ctx.lineWidth = 2 * scale;

      ctx.fillRect(-w * 0.35, -h * 0.22, w * 0.7, h * 0.44);
      ctx.strokeRect(-w * 0.35, -h * 0.22, w * 0.7, h * 0.44);

      const r = h * 0.38;
      const ends = [
        [-w * 0.35, -h * 0.22],
        [-w * 0.35, h * 0.22],
        [w * 0.35, -h * 0.22],
        [w * 0.35, h * 0.22]
      ];
      ends.forEach(([ex, ey]) => {
        ctx.beginPath();
        ctx.arc(ex, ey, r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      });

      ctx.restore();
    }

    function drawFloatingTexts() {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ctx.save();
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.font = "12px 'Press Start 2P'";
        ctx.fillText(ft.text, ft.x - 16, ft.y);
        ctx.restore();

        ft.y -= 1.6;
        ft.alpha -= 0.03;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    function drawUI() {
      ctx.fillStyle = "#000";
      ctx.font = "10px 'Press Start 2P'";
      ctx.fillText(`SCORE`, 20, 32);
      ctx.font = "15px 'Press Start 2P'";
      ctx.fillText(String(Math.floor(score)).padStart(5, '0'), 20, 54);

      ctx.font = "10px 'Press Start 2P'";
      ctx.fillStyle = "#ffcc00";
      ctx.fillText(`🦴 ${bonesCollected}`, 20, 76);

      ctx.fillStyle = "#000";
      ctx.font = "10px 'Press Start 2P'";
      ctx.fillText(`LVL: ${level}`, 330, 32);

      // Speed text indicator
      ctx.font = "8px 'Press Start 2P'";
      ctx.fillStyle = level > 3 ? "#ff3333" : "#00aa44";
      ctx.fillText(`SPD: ${Math.round(speed * 1000)}`, 330, 52);

      // Title
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffcc00";
      ctx.font = "12px 'Press Start 2P'";
      ctx.fillText("RUN", canvas.width / 2, 32);
      ctx.font = "10px 'Press Start 2P'";
      ctx.fillText("COPPER RUN", canvas.width / 2, 48);
      ctx.textAlign = "start";
    }

    // ----------------- GAME LOOP & PHYSICS -----------------

    let roadOffset = 0;

    function update() {
      if (isGameOver) return;
      tickCount++;

      roadOffset = (roadOffset + speed) % 1.0;
      score += speed * 120;
      level = 1 + Math.floor(score / 450);
      speed = 0.006 + (level * 0.0011);

      // --- ระบบควบคุมแบบนุ่มนวล (Smooth Inertia & Gyro) ---
      let moveDir = 0;
      if (keys.left) moveDir -= 1;
      if (keys.right) moveDir += 1;

      // ผสานการเอียงจอ Gyro
      if (gyroActive) {
        moveDir += gyroOffset * 1.3;
      }

      // Physics acceleration & damping
      const accel = 0.0055;
      const friction = 0.82;
      player.vx += moveDir * accel;
      player.vx *= friction;
      player.x += player.vx;

      // บังคับขอบถนน
      if (player.x < -0.82) { player.x = -0.82; player.vx = 0; }
      if (player.x > 0.82) { player.x = 0.82; player.vx = 0; }

      // เอียงตัวตามแรงเหวี่ยง
      player.tiltAngle = player.vx * 3.8;

      // Spawner
      spawnTimer++;
      const spawnInterval = Math.max(22, 60 - level * 4);
      if (spawnTimer >= spawnInterval) {
        spawnEntity();
        spawnTimer = 0;
      }

      // Entity Updates & Collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const ent = obstacles[i];
        ent.z += speed;

        if (ent.z > 0.80 && ent.z < 0.94) {
          const hitRadius = ent.kind === 'poop' ? (ent.type === 'big' ? 0.22 : 0.15) : 0.17;
          if (Math.abs(ent.laneX - player.x) < hitRadius) {
            if (ent.kind === 'poop') {
              triggerGameOver();
              return;
            } else if (ent.kind === 'bone') {
              score += ent.value;
              bonesCollected++;
              const pos = getPerspectivePos(ent.laneX, ent.z);
              addScoreFloat(pos.x, pos.y, `+${ent.value}`, ent.boneType === 'gold' ? '#ffe033' : '#ffffff');
              obstacles.splice(i, 1);
              continue;
            }
          }
        }

        if (ent.z > 1.05) obstacles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawSidewalk(roadOffset);

      obstacles.sort((a, b) => a.z - b.z);
      obstacles.forEach(ent => {
        if (ent.kind === 'poop') drawPoop(ent);
        else if (ent.kind === 'bone') drawBone(ent);
      });

      drawDog(player);
      drawFloatingTexts();
      drawUI();
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.innerText = `SCORE: ${Math.floor(score)}`;
      finalBonesEl.innerText = `BONES: ${bonesCollected}`;
      finalLevelEl.innerText = `LEVEL: ${level}`;
      gameOverScreen.style.display = "flex";
    }

    function resetGame() {
      score = 0;
      bonesCollected = 0;
      level = 1;
      speed = 0.006;
      obstacles = [];
      floatingTexts = [];
      player.x = 0;
      player.vx = 0;
      isGameOver = false;
      gameOverScreen.style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    restartBtn.addEventListener("click", resetGame);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
